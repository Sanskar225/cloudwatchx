version: '3.9'

services:
  # ─── Database ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cwx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudwatchx
      POSTGRES_USER: cwx_user
      POSTGRES_PASSWORD: cwx_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cwx_user -d cloudwatchx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cwx-network

  # ─── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cwx-redis
    restart: unless-stopped
    command: redis-server --requirepass cwx_redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "cwx_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cwx-network

  # ─── Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cwx-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://cwx_user:cwx_password_change_me@postgres:5432/cloudwatchx
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: cwx_redis_password
      JWT_SECRET: change_this_jwt_secret_in_production
      JWT_REFRESH_SECRET: change_this_refresh_secret_in_production
      FRONTEND_URL: http://localhost:3000
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_HOST: prometheus
      GRAFANA_HOST: grafana
      ALERTMANAGER_HOST: alertmanager
      # Optional notifications:
      # SLACK_WEBHOOK_URL: https://hooks.slack.com/services/xxx
      # DISCORD_WEBHOOK_URL: https://discord.com/api/webhooks/xxx
      # SMTP_HOST: smtp.gmail.com
      # SMTP_PORT: 587
      # SMTP_USER: your@email.com
      # SMTP_PASS: your_password
      # ALERT_EMAIL_TO: oncall@yourcompany.com
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cwx-network

  # ─── Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cwx-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - cwx-network

  # ─── Prometheus ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: cwx-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - cwx-network

  # ─── Alertmanager ────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: cwx-alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - cwx-network

  # ─── Grafana ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.3
    container_name: cwx-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_HTTP_PORT: 3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3001"
    depends_on:
      - prometheus
    networks:
      - cwx-network

  # ─── Node Exporter ───────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: cwx-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - cwx-network

  # ─── Nginx (reverse proxy) ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cwx-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - cwx-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  backend_logs:

networks:
  cwx-network:
    driver: bridge
